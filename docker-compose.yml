# Alternativa a PostgreSQL instalado localmente (para quien use Docker).
# Uso: docker compose up -d   -> luego npm run db:create && npm run db:migrate
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace_contabilidad
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

volumes:
  pgdata:
